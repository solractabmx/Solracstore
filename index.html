<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLRAC STORE</title>

<!-- ICONO AUTOMATICO -->
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<meta name="theme-color" content="#7b2cff">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0e0e0e;color:#fff;font-family:Arial,sans-serif}
header{background:linear-gradient(90deg,#ff00d4,#7b2cff,#00e5ff);padding:22px 15px;text-align:center;position:sticky;top:0;z-index:5}
header img{width:80px;height:80px;border-radius:20px;background:#fff;object-fit:cover;border:2px solid #fff}
#s{margin-top:12px;width:92%;max-width:420px;padding:11px 18px;border-radius:25px;border:0;outline:none}
#apps{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:15px;max-width:1100px;margin:0 auto}
@media(min-width:800px){#apps{grid-template-columns:repeat(4,1fr)}}
.app{background:#181818;border:1px solid #222;border-radius:18px;padding:14px;text-align:center;cursor:pointer;transition:.2s}
.app:hover{border-color:#7b2cff}
.app img{width:62px;height:62px;border-radius:13px;background:#222;object-fit:cover}
.app h3{font-size:13px;margin:8px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app p{font-size:11px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#detalle{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);z-index:99;display:none;overflow-y:auto;padding:15px}
#detalle.active{display:flex;justify-content:center;align-items:flex-start}
.det-box{background:#1a1a1a;border:1px solid #333;border-radius:22px;max-width:500px;width:100%;margin:20px auto;overflow:hidden}
.det-head{padding:20px;display:flex;gap:14px;align-items:center;background:#1f1f1f}
.det-head img{width:75px;height:75px;border-radius:16px;background:#222}
.det-head h2{font-size:17px}
.det-head small{color:#888;font-size:12px}
.det-body{padding:18px}
.det-body p{color:#aaa;font-size:13px;line-height:1.6}
.tag{display:inline-block;background:#222;border:1px solid #333;padding:5px 10px;border-radius:20px;font-size:11px;margin:5px 5px 0 0}
.carrusel{display:flex;gap:10px;overflow-x:auto;margin-top:15px;padding-bottom:8px}
.carrusel img{height:320px;border-radius:12px;border:1px solid #333;flex-shrink:0;background:#000}
.btn-instalar{display:block;background:linear-gradient(90deg,#ff00d4,#7b2cff);color:#fff;text-align:center;padding:14px;border-radius:25px;text-decoration:none;font-weight:bold;margin-top:18px}
.btn-cerrar{display:block;background:#252525;color:#fff;text-align:center;padding:12px;border-radius:25px;text-decoration:none;margin-top:10px;font-size:13px;cursor:pointer}
footer{text-align:center;padding:22px;color:#444;font-size:11px;border-top:1px solid #1a1a1a;margin-top:20px}
footer a{color:#777;text-decoration:none;margin:0 8px}
</style>
</head>
<body>

<header>
<img src="logo.png" onerror="this.src='https://via.placeholder.com/80'">
<h1>SOLRAC STORE</h1>
<input id="s" placeholder="🔍 Buscar apps...">
</header>

<div id="apps">Cargando...</div>

<footer>
<a href="terminos.html">Términos</a>
<a href="privacidad.html">Privacidad</a>
<p>© 2026 SOLRAC STORE</p>
</footer>

<div id="detalle" onclick="if(event.target==this)cerrar()">
<div class="det-box">
<div class="det-head">
<img id="d-icon" src="logo.png">
<div>
<h2 id="d-nombre"></h2>
<small id="d-version"></small><br>
<small id="d-peso"></small>
</div>
</div>
<div class="det-body">
<div id="d-tags"></div>
<p id="d-desc"></p>
<div class="carrusel" id="d-caps"></div>
<a id="d-link" class="btn-instalar" target="_blank">INSTALAR APK</a>
<div class="btn-cerrar" onclick="cerrar()">Cerrar</div>
</div>
</div>
</div>

<script>
let todas=[];
const appsDiv=document.getElementById('apps');
function render(lista){
 appsDiv.innerHTML='';
 if(lista.length==0){appsDiv.innerHTML='<p style="grid-column:1/-1;text-align:center;color:#555;padding:40px">No hay apps</p>';return}
 lista.forEach((a,i)=>{
  appsDiv.innerHTML+=`<div class="app" onclick="abrir(${todas.indexOf(a)})"><img src="${a.icon||'logo.png'}" onerror="this.src='logo.png'"><h3>${a.nombre}</h3><p>${a.desc||''}</p></div>`;
 });
}
function abrir(i){
 let a=todas[i]; if(!a) return;
 document.getElementById('d-icon').src=a.icon||'logo.png';
 document.getElementById('d-nombre').innerText=a.nombre;
 document.getElementById('d-version').innerText=a.version||'';
 document.getElementById('d-peso').innerText=a.peso||'';
 document.getElementById('d-desc').innerText=a.descripcion_larga||a.desc||'';
 document.getElementById('d-link').href=a.link;
 document.getElementById('d-tags').innerHTML=`<span class="tag">${a.version||'v1.0'}</span> ${a.peso?`<span class="tag">${a.peso}</span>`:''}`;
 let caps=document.getElementById('d-caps'); caps.innerHTML='';
 if(a.capturas && a.capturas.length>0){ a.capturas.forEach(f=>caps.innerHTML+=`<img src="${f}" loading="lazy">`); } else { caps.innerHTML='<span style="color:#555;font-size:12px">Sin capturas</span>'}
 document.getElementById('detalle').classList.add('active');
}
function cerrar(){document.getElementById('detalle').classList.remove('active')}
fetch('apps.json?v='+Date.now()).then(r=>r.json()).then(d=>{todas=Array.isArray(d)?d:[d];render(todas)}).catch(()=>{
 todas=[{"nombre":"Solrac Onion Browser","desc":"Navegador oficial rapido","descripcion_larga":"Navegador Solrac Onion con privacidad total y bloqueo de anuncios. Optimizado por Solrac VIP.","peso":"18.5 MB","version":"V1.0.0","icon":"logo.png","link":"https://github.com/solractabmx/SolracStore/releases/download/V1.0.0/SolracOnion.apk","capturas":[]}];
 render(todas);
});
document.getElementById('s').addEventListener('input',e=>{
 let t=e.target.value.toLowerCase();
 render(todas.filter(x=>x.nombre.toLowerCase().includes(t)));
});
</script>
</body>
</html>
